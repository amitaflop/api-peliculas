version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_peliculas
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_peliculas
    ports:
      - "5433:5432"
    volumes:
      - pgdata_peliculas:/var/lib/postgresql/data

volumes:
  pgdata_peliculas: